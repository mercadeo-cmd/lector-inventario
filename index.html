
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario EraRelmo</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f3f5f8;
 color:#17212b;
 font:16px system-ui,sans-serif;
}

header{
 background:#17212b;
 color:white;
 padding:22px;
}

header h2{margin:0 0 5px}

main{max-width:620px;margin:auto;padding:14px}

.card{
 background:white;
 border:1px solid #e1e6ed;
 border-radius:16px;
 padding:16px;
 margin:12px 0;
}

button{
 border:0;
 border-radius:11px;
 padding:14px;
 background:#185adb;
 color:white;
 font-weight:bold;
 width:100%;
 font-size:16px;
 cursor:pointer;
}

button:disabled{
 opacity:.5;
 cursor:not-allowed;
}

input{
 padding:13px;
 border:1px solid #ccd4df;
 border-radius:11px;
 font-size:16px;
 min-width:0;
 width:100%;
}

.row{display:flex;gap:8px}

#reader video{width:100%!important}

#status{
 white-space:pre-wrap;
 color:#596579;
 font-size:14px;
 margin-top:10px;
}

.error{color:#b42318!important}
.success{color:#16865b!important}

.result{display:none}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.field{
 background:#f2f5f8;
 padding:10px;
 border-radius:9px;
 overflow-wrap:anywhere;
}

.field small{
 display:block;
 color:#667085;
 margin-bottom:4px;
}

.field b{font-size:15px}

.stock{
 background:#e9f7ef;
 border:1px solid #c5e9d3;
 padding:16px;
 border-radius:12px;
 margin-top:14px;
 text-align:center;
}

.stock small{
 display:block;
 color:#397451;
}

.stock strong{
 display:block;
 color:#16865b;
 font-size:30px;
 margin-top:4px;
}

.withdraw{
 border-top:1px solid #e1e6ed;
 margin-top:18px;
 padding-top:18px;
}

.withdraw label{
 display:block;
 font-weight:bold;
 margin-bottom:8px;
}

.withdraw button{margin-top:10px}

h2{font-size:18px;margin:0 0 12px}

@media(max-width:420px){
 .row{flex-direction:column}
 .grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<header>
<h2>⌁ Inventario EraRelmo</h2>
Control de existencias y retiros en libras
</header>

<main>

<section class="card">
<h2>Escáner de cámara</h2>
<p>Activa la cámara trasera y enfoca el código de barras.</p>

<div id="reader"></div>

<button id="start">Activar cámara</button>

<button id="stop"
 style="display:none;background:#e8eefc;color:#185adb;margin-top:8px">
Detener cámara
</button>

<div id="status">Preparado.</div>
</section>

<section class="card">
<h2>Buscar producto</h2>

<div class="row">
<input id="manual" placeholder="Ej. ER-000001">
<button id="search" style="width:auto">Buscar</button>
</div>
</section>

<section class="card result" id="result">

<h2 id="code"></h2>

<div class="grid">

<div class="field">
<small>Producto</small>
<b id="product"></b>
</div>

<div class="field">
<small>Marca</small>
<b id="brand"></b>
</div>

<div class="field">
<small>Calibre</small>
<b id="gauge"></b>
</div>

<div class="field">
<small>Peso de ingreso</small>
<b id="weight"></b>
</div>

<div class="field">
<small>Fecha de ingreso</small>
<b id="date"></b>
</div>

<div class="field">
<small>Observaciones</small>
<b id="notes"></b>
</div>

</div>

<div class="stock">
<small>EXISTENCIA DISPONIBLE</small>
<strong id="stock">0 lb</strong>
</div>

<div class="withdraw">

<h2>Registrar retiro</h2>

<label for="pounds">
¿Cuántas libras vas a retirar?
</label>

<input
 id="pounds"
 type="number"
 min="0.01"
 step="0.01"
 placeholder="Ej. 25"
>

<button id="confirmWithdraw">
Confirmar retiro
</button>

<div id="withdrawStatus" style="margin-top:12px;font-size:14px"></div>

</div>

</section>

</main>

<script>

const API =
'https://erarelmo-inventario-api.mercadeo-6c7.workers.dev';

const $ = id => document.getElementById(id);

let scanner = null;
let running = false;
let busy = false;
let submitting = false;
let currentProduct = null;

function status(message,error=false){
 $('status').textContent = message;
 $('status').className = error ? 'error' : '';
}

function withdrawMessage(message,error=false){
 $('withdrawStatus').textContent = message;
 $('withdrawStatus').className =
 error ? 'error' : 'success';
}

function formatPounds(value){
 return Number(value || 0).toLocaleString(
  'es-GT',
  {minimumFractionDigits:2,maximumFractionDigits:2}
 )+' lb';
}


/************************************************
 * CONSULTAR PRODUCTO
 ************************************************/

async function lookup(code){

 code = String(code || '').trim().toUpperCase();

 if(!code){
  status('Escribe o escanea un código.',true);
  return;
 }

 if(busy)return;

 busy = true;
 status('Consultando inventario…');

 $('result').style.display = 'none';
 currentProduct = null;

 try{

  const response = await fetch(
   API+'?code='+encodeURIComponent(code)+'&_='+Date.now(),
   {method:'GET',cache:'no-store'}
  );

  if(!response.ok){
   throw new Error('Error del servidor: '+response.status);
  }

  const data = await response.json();

  if(!data || !data.ok || !data.product){
   throw new Error(data?.error || 'Producto no encontrado.');
  }

  showProduct(data.product);

  status('Producto encontrado correctamente.');

 }catch(error){

  $('result').style.display = 'none';
  status(error.message,true);

 }finally{

  busy = false;

 }

}


/************************************************
 * MOSTRAR PRODUCTO Y EXISTENCIAS
 ************************************************/

function showProduct(r){

 currentProduct = r;

 $('code').textContent = r.code;
 $('product').textContent = r.product || '—';
 $('brand').textContent = r.brand || '—';
 $('gauge').textContent = r.gauge || '—';

 $('weight').textContent = formatPounds(r.weight);
 $('stock').textContent = formatPounds(r.stock);

 $('date').textContent = r.date || '—';
 $('notes').textContent = r.notes || '—';

 $('pounds').value = '';
 $('withdrawStatus').textContent = '';

 $('result').style.display = 'block';

 $('confirmWithdraw').disabled =
  Number(r.stock) <= 0;

}


/************************************************
 * REGISTRAR RETIRO
 ************************************************/

async function confirmWithdraw(){

 if(submitting)return;

 if(!currentProduct){
  withdrawMessage('Primero consulta un producto.',true);
  return;
 }

 const pounds = Number($('pounds').value);
 const available = Number(currentProduct.stock);

 if(!Number.isFinite(pounds) || pounds <= 0){
  withdrawMessage('Ingresa una cantidad válida de libras.',true);
  return;
 }

 if(pounds > available){
  withdrawMessage(
   'No hay suficientes existencias. Disponible: '+
   formatPounds(available),
   true
  );
  return;
 }

 const confirmed = window.confirm(
  '¿Confirmas retirar '+formatPounds(pounds)+
  ' del producto '+currentProduct.code+'?'
 );

 if(!confirmed)return;

 submitting = true;

 const button = $('confirmWithdraw');
 button.disabled = true;
 button.textContent = 'Registrando retiro…';

 withdrawMessage('Guardando movimiento…');

 try{

  const response = await fetch(API,{
   method:'POST',
   headers:{
    'Content-Type':'application/json'
   },
   body:JSON.stringify({
    code:currentProduct.code,
    pounds:pounds
   })
  });

  const data = await response.json();

  if(!response.ok || !data.ok){
   throw new Error(data.error || 'No se pudo registrar el retiro.');
  }

  currentProduct.stock = Number(data.stock);

  $('stock').textContent = formatPounds(data.stock);

  $('pounds').value = '';

  withdrawMessage(
   '¡Retiro registrado correctamente! Se retiraron '+
   formatPounds(data.withdrawn)+
   '. Existencia restante: '+formatPounds(data.stock)
  );

  button.disabled = Number(data.stock) <= 0;

 }catch(error){

  withdrawMessage(error.message,true);

 }finally{

  submitting = false;
  button.textContent = 'Confirmar retiro';

  if(currentProduct){
   button.disabled = Number(currentProduct.stock) <= 0;
  }

 }

}


/************************************************
 * ESCANEAR CÓDIGO
 ************************************************/

function scanned(code){

 code = String(code || '').trim().toUpperCase();

 if(!code || busy)return;

 $('manual').value = code;

 stop();

 lookup(code);

}


/************************************************
 * ACTIVAR CÁMARA
 ************************************************/

async function start(){

 try{

  if(!window.isSecureContext ||
     !navigator.mediaDevices?.getUserMedia){
   throw Error('La cámara requiere HTTPS y permisos del navegador.');
  }

  if(!window.Html5Qrcode){
   throw Error('No cargó el lector. Recarga la página.');
  }

  scanner = new Html5Qrcode('reader');

  await scanner.start(
   {facingMode:'environment'},
   {
    fps:10,
    qrbox:(w,h)=>({
     width:Math.min(320,w-20),
     height:130
    }),
    formatsToSupport:[
     Html5QrcodeSupportedFormats.CODE_128,
     Html5QrcodeSupportedFormats.CODE_39,
     Html5QrcodeSupportedFormats.EAN_13,
     Html5QrcodeSupportedFormats.EAN_8
    ]
   },
   scanned,
   ()=>{}
  );

  running = true;

  $('start').style.display = 'none';
  $('stop').style.display = 'block';

  status('Cámara activa. Enfoca el código.');

 }catch(error){

  status('Error de cámara: '+error.message,true);

 }

}


/************************************************
 * DETENER CÁMARA
 ************************************************/

async function stop(){

 const activeScanner = scanner;

 scanner = null;
 running = false;

 if(activeScanner){

  try{
   await activeScanner.stop();
  }catch(error){}

  try{
   await activeScanner.clear();
  }catch(error){}

 }

 $('start').style.display = 'block';
 $('stop').style.display = 'none';

}


/************************************************
 * BOTONES Y EVENTOS
 ************************************************/

$('start').onclick = start;
$('stop').onclick = stop;

$('search').onclick = () => lookup($('manual').value);

$('manual').onkeydown = event => {
 if(event.key === 'Enter'){
  lookup($('manual').value);
 }
};

$('confirmWithdraw').onclick = confirmWithdraw;

</script>

</body>
</html>
